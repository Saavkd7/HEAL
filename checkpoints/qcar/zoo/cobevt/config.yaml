Ncams: 1
_qcar_amp_enabled: true
_qcar_amp_requested: true
_qcar_effective_batch_size: 2
_qcar_encoder_initialization_checkpoint: checkpoints/qcar/HeterBaseline_opv2v_camera_attfuse_2023_08_08_16_50_01/net_epoch_bestval_at17.pth
_qcar_encoder_initialization_prefixes:
- encoder_m2.
- backbone_m2.
- aligner_m2.
_qcar_freeze_encoder_blocks: 8
_qcar_gradient_accumulation_steps: 2
_qcar_gradient_clip: 10.0
_qcar_loss_packages:
- opencood.loss
- qcar.losses
_qcar_model_packages:
- opencood.models
_qcar_plugins:
- qcar.patches.patch_1cam_loader
- qcar.patches.patch_real_extrinsic
_qcar_pretrained_checkpoint: null
_qcar_seed: 42
_qcar_stage: 'QCar model zoo: cobevt (camera), generated by qcar/zoo.py from qcar/configs/camera_attfuse_coop.yaml
  + opencood/hypes_yaml/opv2v/CameraOnly/camera_cobevt.yaml'
_qcar_train_script: /mnt/mainvolume/Backup/Projects/HEAL/qcar/train.py
add_data_extension:
- bev_visibility.png
cav_lidar_range: &id003
- -51.2
- -51.2
- -3
- 51.2
- 51.2
- 1
comm_range: 70
fusion:
  args:
    data_aug_conf: None
    grid_conf: None
    proj_first: false
  core_method: intermediateheter
  dataset: opv2v
heter:
  assignment_path: opencood/logs/heter_modality_assign/qcar_real/qcar_coop_modality.json
  ego_modality: m2
  mapping_dict:
    m1: m2
    m2: m2
    m3: m2
    m4: m2
  modality_setting:
    m2:
      core_method: lift_splat_shoot
      data_aug_conf:
        H: 480
        Ncams: 1
        W: 640
        bot_pct_lim:
        - 0.0
        - 0.05
        cams:
        - camera0
        - camera1
        - camera2
        - camera3
        final_dim:
        - 384
        - 512
        rand_flip: true
        resize_lim:
        - 0.8125
        - 0.875
        rot_lim:
        - -3.6
        - 3.6
      grid_conf:
        ddiscr:
        - 2
        - 50
        - 48
        mode: LID
        xbound:
        - -51.2
        - 51.2
        - 0.4
        ybound:
        - -51.2
        - 51.2
        - 0.4
        zbound:
        - -10
        - 10
        - 20.0
      sensor_type: camera
input_source:
- camera
label_type: camera
loss:
  args:
    cls:
      alpha: 0.25
      gamma: 2.0
      type: SigmoidFocalLoss
      weight: 1.0
    depth:
      weight: 1.0
    dir:
      args: &id005
        anchor_yaw: &id004
        - 0
        - 90
        dir_offset: 0.7853
        num_bins: 2
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
    pos_cls_weight: 2.0
    reg:
      codewise: true
      sigma: 3.0
      type: WeightedSmoothL1Loss
      weight: 2.0
  core_method: point_pillar_depth_balanced_bce_loss
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 8
  - 12
max_cav: 2
model:
  args:
    anchor_number: 2
    cobevt:
      agent_size: 2
      depth: 3
      dim_head: 32
      drop_out: 0.1
      input_dim: 256
      mlp_dim: 256
      window_size: 4
    dir_args:
      anchor_yaw:
      - 0
      - 90
      dir_offset: 0.7853
      num_bins: 2
    ego_modality: m2
    fusion_method: cobevt
    in_head: 256
    lidar_range: &id001
    - -51.2
    - -51.2
    - -3
    - 51.2
    - 51.2
    - 1
    m2:
      backbone_args:
        inplanes: 128
        layer_nums:
        - 3
        - 5
        - 8
        layer_strides:
        - 2
        - 2
        - 2
        num_filters:
        - 64
        - 128
        - 256
        num_upsample_filter:
        - 128
        - 128
        - 128
        upsample_strides:
        - 1
        - 2
        - 4
      camera_mask_args:
        cav_lidar_range: *id001
        grid_conf: &id002
          ddiscr:
          - 2
          - 50
          - 48
          mode: LID
          xbound:
          - -51.2
          - 51.2
          - 0.4
          ybound:
          - -51.2
          - 51.2
          - 0.4
          zbound:
          - -10
          - 10
          - 20.0
      core_method: lift_splat_shoot
      encoder_args:
        anchor_number: 2
        camera_encoder: EfficientNet
        data_aug_conf:
          H: 480
          Ncams: 1
          W: 640
          bot_pct_lim:
          - 0.0
          - 0.05
          cams:
          - camera0
          - camera1
          - camera2
          - camera3
          final_dim:
          - 384
          - 512
          rand_flip: true
          resize_lim:
          - 0.8125
          - 0.875
          rot_lim:
          - -3.6
          - 3.6
        depth_supervision: false
        grid_conf: *id002
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
      sensor_type: camera
      shrink_header:
        dim:
        - 256
        input_dim: 384
        kernal_size:
        - 3
        padding:
        - 1
        stride:
        - 2
  core_method: heter_model_baseline
name: QCarZoo_cobevt
noise_setting: !!python/object/apply:collections.OrderedDict
- - - add_noise
    - false
optimizer:
  args:
    eps: 1.0e-10
    weight_decay: 0.0001
  core_method: Adam
  lr: 0.0001
postprocess:
  anchor_args:
    D: 1
    H: 256
    W: 256
    cav_lidar_range: *id003
    feature_stride: 4
    h: 1.56
    l: 3.9
    num: 2
    r: *id004
    vd: 4
    vh: 0.4
    vw: 0.4
    w: 1.6
  core_method: VoxelPostprocessor
  dir_args: *id005
  gt_range: *id003
  max_num: 150
  nms_thresh: 0.05
  order: hwl
  target_args:
    neg_threshold: 0.45
    pos_threshold: 0.6
    score_threshold: 0.2
preprocess:
  args:
    max_points_per_voxel: 1
    max_voxel_test: 1
    max_voxel_train: 1
    voxel_size:
    - 0.4
    - 0.4
    - 4
  cav_lidar_range: *id003
  core_method: SpVoxelPreprocessor
root_dir: qcar_dataset/pipeline/datasets/CoopFront/train
test_dir: null
train_params:
  batch_size: 1
  epoches: 15
  eval_freq: 1
  max_cav: 2
  save_freq: 1
validate_dir: qcar_dataset/pipeline/datasets/CoopFront/validate
yaml_parser: load_general_params
