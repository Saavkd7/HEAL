name: HeterBaseline_opv2v_camera_attfuse_qcar_coop
# Fill this in by hand once the pretrain run (camera_attfuse_pretrain.yaml)
# picks a final best checkpoint, e.g.
#   opencood/logs/HeterBaseline_opv2v_camera_attfuse_qcar_pretrain_<run>/net_epoch_bestval_at1.pth
_qcar_pretrained_checkpoint: opencood/logs/HeterBaseline_opv2v_camera_attfuse_qcar_pretrain_<run>/net_epoch_bestval_at1.pth
_qcar_stage: "cooperation training -- two real agents (qcar-52775 x qcar-52776), starting from the pretrained encoder"
_qcar_freeze_encoder_blocks: 8  # same freeze as pretrain; CoopFront is small (819 train pairs), keep conservative
root_dir: qcar_dataset/pipeline/datasets/CoopFront/train
validate_dir: qcar_dataset/pipeline/datasets/CoopFront/validate
test_dir: null
yaml_parser: load_general_params
train_params: {batch_size: 2, epoches: 15, eval_freq: 1, save_freq: 1, max_cav: 2}
comm_range: 70
input_source: [camera]
label_type: camera
cav_lidar_range: &id001 [-51.2, -51.2, -3, 51.2, 51.2, 1]
add_data_extension: [bev_visibility.png]
heter:
  assignment_path: opencood/logs/heter_modality_assign/qcar_real/qcar_coop_modality.json
  ego_modality: m2
  mapping_dict: {m1: m2, m2: m2, m3: m2, m4: m2}
  modality_setting:
    m2:
      sensor_type: camera
      core_method: lift_splat_shoot
      grid_conf: &id003
        xbound: [-51.2, 51.2, 0.4]
        ybound: [-51.2, 51.2, 0.4]
        zbound: [-10, 10, 20.0]
        ddiscr: [2, 50, 48]
        mode: LID
      data_aug_conf: &id004
        resize_lim: [0.8125, 0.875]
        final_dim: [384, 512]
        rot_lim: [-3.6, 3.6]
        H: 480
        W: 640
        rand_flip: true
        bot_pct_lim: [0.0, 0.05]
        cams: [camera0, camera1, camera2, camera3]
        Ncams: 1
fusion:
  core_method: intermediateheter
  dataset: opv2v
  args: {proj_first: false, grid_conf: None, data_aug_conf: None}
preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size: [0.4, 0.4, 4]
    max_points_per_voxel: 1
    max_voxel_train: 1
    max_voxel_test: 1
  cav_lidar_range: *id001
postprocess:
  core_method: VoxelPostprocessor
  gt_range: *id001
  anchor_args:
    cav_lidar_range: *id001
    l: 3.9
    w: 1.6
    h: 1.56
    r: &id002 [0, 90]
    feature_stride: 2
    num: 2
  target_args: {pos_threshold: 0.6, neg_threshold: 0.45, score_threshold: 0.2}
  order: hwl
  max_num: 150
  nms_thresh: 0.05
  dir_args: &id005
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *id002
model:
  core_method: heter_model_baseline
  args:
    ego_modality: m2
    lidar_range: *id001
    m2:
      core_method: lift_splat_shoot
      sensor_type: camera
      encoder_args:
        anchor_number: 2
        grid_conf: *id003
        data_aug_conf: *id004
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: false
        camera_encoder: EfficientNet
      camera_mask_args:
        cav_lidar_range: *id001
        grid_conf: *id003
      backbone_args:
        layer_nums: [3, 5, 8]
        layer_strides: [2, 2, 2]
        num_filters: [64, 128, 256]
        upsample_strides: [1, 2, 4]
        num_upsample_filter: [128, 128, 128]
        inplanes: 128
      shrink_header:
        kernal_size: [3]
        stride: [1]
        padding: [1]
        dim: [256]
        input_dim: 384
    fusion_method: att
    att: {feat_dim: 256}
    in_head: 256
    anchor_number: 2
    dir_args: *id005
loss:
  core_method: point_pillar_depth_balanced_bce_loss
  args:
    pos_cls_weight: 2.0
    cls: {type: SigmoidFocalLoss, alpha: 0.25, gamma: 2.0, weight: 1.0}
    reg: {type: WeightedSmoothL1Loss, sigma: 3.0, codewise: true, weight: 2.0}
    dir:
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
      args: *id005
    depth: {weight: 1.0}
optimizer:
  core_method: Adam
  lr: 0.0001
  args: {eps: 1e-10, weight_decay: 1e-4}
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [8, 12]
max_cav: 2
Ncams: 1
